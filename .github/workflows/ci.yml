name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Runs the full suite, including the in-process `analyze` runs against the
      # leaky/clean/middling fixtures. The clean-repo "no findings" assertion is
      # the hard gate: a regression that introduces a false positive fails here.
      - name: Test
        run: npm test
